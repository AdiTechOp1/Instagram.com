<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minstagram</title>
<style>
  :root{
    --bg: #ebebeb;
    --card-bg: #ffffff;
    --card-border: #dbdbdb;
    --text-primary: #262626;
    --text-secondary: #8e8e8e;
    --input-border: #dbdbdb;
    --input-bg: #fafafa;
    --accent: #3797f0;
    --accent-disabled: #b2dcff;
    --divider: #dbdbdb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    width: 100%;
    max-width: 350px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 1px;
    padding: 40px 40px 24px;
    text-align: center;
    margin-bottom: 10px;
  }

  .wordmark {
    font-size: 40px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 28px;
    letter-spacing: -0.5px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input {
    width: 100%;
    padding: 9px 8px;
    font-size: 12px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 3px;
    color: var(--text-primary);
    outline: none;
  }

  input::placeholder {
    color: var(--text-secondary);
  }

  input:focus {
    border-color: #a8a8a8;
    background: #fff;
  }

  .submit-btn {
    margin-top: 8px;
    padding: 7px 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .submit-btn:disabled {
    background: var(--accent-disabled);
    cursor: default;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 18px 0 18px;
  }

  .divider div {
    flex: 1;
    height: 1px;
    background: var(--divider);
  }

  .divider span {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .forgot {
    font-size: 12px;
    color: #00376b;
    text-decoration: none;
  }

  .secondary-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 1px;
    padding: 20px;
    text-align: center;
    font-size: 14px;
    color: var(--text-primary);
  }

  .secondary-card a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }

  .status {
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
    color: #2e7d32;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <p class="wordmark">Minstagram</p>

      <form id="loginForm">
        <input type="text" id="username" name="username" placeholder="Phone number, username, or email" autocomplete="username" required>
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="submit-btn" id="submitBtn" disabled>Log in</button>
      </form>

      <div class="divider"><div></div><span>OR</span><div></div></div>

      <a href="#" class="forgot">Forgot password?</a>

      <p class="status" id="status"></p>
    </div>

    <div class="secondary-card">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const submitBtn = document.getElementById('submitBtn');
  const status = document.getElementById('status');

  function updateButtonState() {
    submitBtn.disabled = !(username.value.trim() && password.value.trim());
  }
  username.addEventListener('input', updateButtonState);
  password.addEventListener('input', updateButtonState);

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const payload = {
      username: username.value,
      password: password.value
    };

    // Replace this URL with your own backend endpoint.
    // The endpoint should hash the password (e.g. with bcrypt) before
    // storing anything — never store or email plaintext passwords.
    const ENDPOINT = '/api/login';

    try {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        status.textContent = 'Submitted.';
      } else {
        status.style.color = '#c0392b';
        status.textContent = 'Something went wrong. Try again.';
      }
    } catch (err) {
      status.style.color = '#c0392b';
      status.textContent = 'No backend connected yet (' + ENDPOINT + ').';
    } finally {
      submitBtn.textContent = 'Log in';
      updateButtonState();
    }
  });
</script>

</body>
</html>
